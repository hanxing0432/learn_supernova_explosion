<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学习视频（任务点未完成 + 视频在播）</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
  iframe { width: 640px; height: 380px; border: 0; display: block; margin: 20px; background: #000; }
  #prevNextFocusNext { margin-left: 20px; padding: 8px 22px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #test-report { position: fixed; right: 8px; bottom: 8px; width: 320px; height: 150px; font-size: 10px; background: #08101f; color: #9fb6d4; overflow: auto; padding: 6px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="ans-job-video" aria-label="学习视频 任务点未完成"></div>
<div class="ans-job-work" aria-label="学习测验 任务点未完成"></div>
<iframe id="vf" src="/video-frame.html"></iframe>
<button id="prevNextFocusNext">下一节</button>
<pre id="test-report">{}</pre>
<script>
(function () {
  const state = { clicks: 0, clickTimes: [], startedAt: Date.now() };
  document.getElementById('prevNextFocusNext').addEventListener('click', () => {
    state.clicks++;
    state.clickTimes.push(Date.now() - state.startedAt);
  });
  const frame = document.getElementById('vf');
  setInterval(() => {
    let ended = true;
    try { ended = !!frame.contentWindow.__ended; } catch (e) {}
    document.getElementById('test-report').textContent = JSON.stringify({
      clicks: state.clicks,
      clickTimes: state.clickTimes,
      elapsed: Date.now() - state.startedAt,
      videoEnded: ended
    });
  }, 250);
})();
</script>
</body>
</html>
