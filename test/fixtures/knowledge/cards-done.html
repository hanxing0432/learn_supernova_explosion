<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学习视频（任务点已完成 + 视频仍在播）</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
  iframe { width: 640px; height: 380px; border: 0; display: block; margin: 20px; background: #000; }
  .toc { position: absolute; left: -9999px; top: 0; width: 300px; }
  #prevNextFocusNext { margin-left: 20px; padding: 8px 22px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #test-report { position: fixed; right: 8px; bottom: 8px; width: 320px; height: 150px; font-size: 10px; background: #08101f; color: #9fb6d4; overflow: auto; padding: 6px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="ans-job-video" aria-label="学习视频 任务点已完成"></div>
<div class="ans-job-work" aria-label="学习测验 任务点已完成"></div>
<div class="toc">
  <div class="posCatalog_select"><span class="posCatalog_name" onclick="getTeacherAjax('111','222','1','444','','','false')">1.1 当前章节</span></div>
  <div class="posCatalog_select"><span class="posCatalog_name" onclick="getTeacherAjax('111','222','2','444','','','false')">1.2 下一章</span></div>
</div>
<iframe id="vf" src="/video-frame-long.html"></iframe>
<button id="prevNextFocusNext">下一节</button>
<pre id="test-report">{}</pre>
<script>
(function () {
  const state = { clicks: 0, tocClicks: 0, buttonClicks: 0, clickTimes: [], playingAtClick: null, startedAt: Date.now() };
  const frame = document.getElementById('vf');
  function record(kind) {
    state.clicks++;
    state.clickTimes.push(Date.now() - state.startedAt);
    if (kind === 'toc') state.tocClicks++; else state.buttonClicks++;
    try {
      state.playingAtClick = !frame.contentWindow.__ended;
      state.timeAtClick = frame.contentWindow.__time || 0;
    } catch (e) {}
  }
  document.querySelectorAll('.posCatalog_name').forEach(function (sp) {
    sp.addEventListener('click', function () { record('toc'); });
  });
  document.getElementById('prevNextFocusNext').addEventListener('click', function () { record('button'); });
  setInterval(() => {
    let ended = true, t = 0;
    try { ended = !!frame.contentWindow.__ended; t = frame.contentWindow.__time || 0; } catch (e) {}
    document.getElementById('test-report').textContent = JSON.stringify({
      clicks: state.clicks,
      tocClicks: state.tocClicks,
      buttonClicks: state.buttonClicks,
      clickTimes: state.clickTimes,
      playingAtClick: state.playingAtClick,
      timeAtClick: state.timeAtClick,
      videoEnded: ended,
      videoTime: t,
      elapsed: Date.now() - state.startedAt
    });
  }, 250);
})();
</script>
</body>
</html>
