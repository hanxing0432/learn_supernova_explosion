<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课程外壳页 · 仿真（只有目录，不是学习页）</title>
<style>
  body { margin: 0; background: #f3f6fb; color: #333; font: 14px/1.7 "Microsoft YaHei", sans-serif; }
  .head { padding: 18px 24px 6px; }
  .head h3 { margin: 0 0 6px; font-size: 17px; }
  .prog { color: #e8833a; font-size: 13px; }
  .catalog { background: #fff; margin: 10px 24px 24px; border-radius: 10px; padding: 14px 18px; }
  .catalog h4 { margin: 4px 0 10px; font-size: 14px; color: #666; }
  .chapter { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #eee; }
  .chapter .ok { color: #22a06b; font-weight: 700; }
  .chapter .no { color: #c9ced6; }
  #test-report { position: fixed; right: 8px; bottom: 8px; width: 320px; height: 120px; font-size: 10px; background: #08101f; color: #9fb6d4; overflow: auto; padding: 6px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="head">
  <h3>上海市大学生安全教育（2026级）</h3>
  <div class="prog">● 已完成任务点：123/329</div>
</div>

<div class="catalog">
  <h4>目录</h4>
  <div class="chapter"><span class="ok">✓</span><span>1.1 安全教育概述</span></div>
  <div class="chapter"><span class="ok">✓</span><span>1.1.1 安全教育概述</span></div>
  <div class="chapter"><span class="ok">✓</span><span>1.2 国家安全</span></div>
  <div class="chapter"><span class="ok">✓</span><span>1.2.1 国家安全的重要性</span></div>
  <div class="chapter"><span class="no">○</span><span>1.3 消防安全</span></div>
</div>

<pre id="test-report">{}</pre>
<script>
(function () {
  function snap() {
    return {
      hud: !!document.getElementById('__cx_hud_host'),
      pageKind: (window.CX && window.CX.pageKind) || '',
      studyContext: (window.CX && window.CX.isStudyContext) ? !!window.CX.isStudyContext() : null,
      hasDom: (window.CX && window.CX.hasStudyDom) ? !!window.CX.hasStudyDom() : null
    };
  }
  setInterval(function () {
    document.getElementById('test-report').textContent = JSON.stringify(snap());
  }, 400);
  window.__fixture = { snap: snap };
})();
</script>
</body>
</html>
